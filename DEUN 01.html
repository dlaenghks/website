  body {
    min-width: 100%;
    font-size: 16px;
    background: #fff;

    -webkit-text-size-adjust: none;

  #footer dl dd {

  #footer dl dd .tail_links a {

  }

/* ====================
   [신규 추가] Footer 스타일 (타겟 디자인 이식)
   ==================== */
.footer-section {
    #width: 100%;
    #height: 100%;
    background-color: #1b97a1; /* 타겟 소스의 짙은 회색 배경 */
    padding: 50px 0;
    color: #fff;
    border-top: 1px solid #ddd;
}

.footer-container {
    max-width: 1300px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    align-items: center; /* 수직 중앙 정렬 */
    justify-content: flex-start;
    flex-wrap: wrap;
}

/* 로고 영역 */
.footer-logo {
    margin-right: 60px;
}

.footer-logo img {
    width: 300px; /* 타겟 소스 사이즈 유지 */
    height: auto;
    display: block;
}

/* 정보 텍스트 영역 */
.footer-info {
    flex: 1;
    font-size: 15px;
    line-height: 1.6;
}

.footer-info address {
    font-style: normal;
    margin-bottom: 15px;
}

/* 정보 사이의 구분선 (|) 처리 */
.footer-info span {
    position: relative;
    display: inline-block;
    padding-right: 15px;
    margin-right: 5px;
    color: #fff;
    white-space: nowrap;
}

/* 첫 번째 요소를 제외하고 왼쪽에 구분선 추가 */
.footer-info span:not(:first-child)::before {
    content: "";
    position: absolute;
    left: -10px;
    top: 50%;
    transform: translateY(-50%);
    width: 1px;
    height: 10px;
    background-color: #aaa;
}

/* 줄바꿈용 br 태그 후 첫 번째 span은 구분선 제거 */
.footer-info br + span::before {
    display: none;
}

.footer-copyright {
    color: #aaa; /* 타겟 소스 느낌 살림 */
    font-size: 0.9rem;
}

.footer-copyright b {
    color: #fff;
}

/* ====================
   Footer 반응형 (모바일)
   ==================== */
@media (max-width: 768px) {
    .footer-section {
        padding: 30px 0;
        text-align: center;
    }

    .footer-container {
        flex-direction: column;
        justify-content: center;
    }

    .footer-logo {
        margin-right: 0;
        margin-bottom: 20px;
    }

    .footer-logo img {
        width: 200px; /* 모바일에서는 로고 크기 조정 */
        margin: 0 auto;
    }

    .footer-info {
        width: 100%;
        font-size: 13px;
    }
    
    .footer-info span {
        display: inline-block; /* 모바일에서는 줄바꿈 자연스럽게 */
        padding-right: 5px;
        margin-right: 0;
        margin-bottom: 5px;
        color: #ffffff;
    }

    /* 모바일에서는 구분선 숨김 */
    .footer-info span::before,
    .footer-info span:not(:first-child)::before {
        display: none;
    }
    
    .footer-info br {
        display: none; /* 모바일에서 강제 줄바꿈 무시 */
    }
    
    .footer-copyright {
        margin-top: 15px;
        font-size: 12px;
    }
}
