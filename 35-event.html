<script>
    document.onmousemove = function(e) {
        var x = e.pageX;
        var y = e.pageY;
        var img = document.getElementById("myimage");
        img.style.left = (x + 20) + 'px';  // 오른쪽 하단에 위치시키기 위해 X 위치에 추가적으로 20px 이동
        img.style.top = (y + 20) + 'px';   // 오른쪽 하단에 위치시키기 위해 Y 위치에 추가적으로 20px 이동
        img.style.display = "block";
    };
    
    document.onmouseleave = function() {
        var img = document.getElementById("myimage");
        img.style.display = "none";
    }
    </script>
